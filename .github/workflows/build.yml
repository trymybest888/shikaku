name: Build and test

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run regression tests
        shell: powershell
        run: powershell -ExecutionPolicy Bypass -File .\tests\run-tests.ps1

      - name: Build Shikaku.exe
        shell: powershell
        run: powershell -ExecutionPolicy Bypass -File .\build-desktop.ps1

      - uses: actions/upload-artifact@v4
        with:
          name: Shikaku
          path: Shikaku.exe

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: Shikaku.exe
